<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RTX 5000 Series Review</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>RTX 5000 Series Review</h1>
  </header>

  <main>
    <section class="product">
      <img src="https://www.nvidia.com/content/dam/en-zz/Solutions/geforce/rtx-3080/gallery/rtx-3080-gallery-1.png" alt="RTX 5000 Series">
      <div class="description">
        <h2>NVIDIA RTX 5000 Series</h2>
        <p>Experience next-gen performance and AI-powered graphics with the NVIDIA RTX 5000 series GPUs. Perfect for gaming, rendering, and AI workloads.</p>
      </div>
    </section>

    <section class="rating">
      <h3>Rate this product:</h3>
      <div class="stars">
        <span data-value="1">&#9733;</span>
        <span data-value="2">&#9733;</span>
        <span data-value="3">&#9733;</span>
        <span data-value="4">&#9733;</span>
        <span data-value="5">&#9733;</span>
      </div>
      <p id="rating-value">Your rating: 0</p>
    </section>

    <section class="feedback">
      <h3>Do you like it?</h3>
      <button id="like">👍 Like</button>
      <button id="dislike">👎 Dislike</button>
      <p id="feedback-result"></p>
    </section>

    <section class="reviews">
      <h3>Write a review:</h3>
      <textarea id="review-text" placeholder="Write your review here..."></textarea>
      <button id="submit-review">Submit Review</button>
      <ul id="reviews-list"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
